[project]
name = "robot-agent-mcp"
version = "0.1.0"
description = "An MCP-powered robot control agent with a Chainlit chat interface."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chainlit>=2.11.1",
    "langchain>=1.3.9",
    "langchain-google-genai>=4.2.5",
    "mcp>=1.28.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]
